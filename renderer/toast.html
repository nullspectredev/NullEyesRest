<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NullEyesRest</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: transparent; }
    .toast {
      margin: 8px;
      height: calc(100% - 16px);
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px;
      background: rgba(7, 11, 24, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 24px rgba(79, 124, 255, 0.18);
      animation: fadeUp 0.35s ease both;
    }
    .toast img {
      width: 40px; height: 40px; border-radius: 50%;
      box-shadow: 0 0 14px rgba(79, 124, 255, 0.5);
    }
    .toast .title {
      font-size: 13px; font-weight: 700;
      background: var(--grad);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .toast .msg { font-size: 13px; color: var(--text); margin-top: 2px; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="toast">
    <img src="../assets/logo.png" alt="logo" />
    <div>
      <div class="title">NullEyesRest</div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('msg').textContent = params.get('msg') || 'NullEyesRest is running.';
  </script>
</body>
</html>
